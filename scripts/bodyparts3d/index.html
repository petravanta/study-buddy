<!doctype html><html><body style="margin:0;background:#fff">
<!-- Draws BodyParts3D parts (bones, muscles) with three.js; shoot.js calls window.shot(job) for each picture. See README.md. -->
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
let W = 900, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0xffffff, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6); scene.add(key); scene.add(key.target);
const parts = new Map();
const BONE = 0xe9dfc8, HI = 0xd9382c, DIM = 0xf1ece2, CART = 0xc9d6dc, MUSCLE = 0xd6b3a6, TENDON = 0xeee6d2, BRAIN = 0xd9bfc0, ARTERY = 0xcf9a82, VEIN = 0x8fa6c9, HEART = 0xd98f8f;
const COLOUR = { bone: BONE, cartilage: CART, muscle: MUSCLE, tendon: TENDON, brain: BRAIN, artery: ARTERY, vein: VEIN, heart: HEART };
const list = (await (await fetch('parts.tsv')).text()).trim().split('\n').map(l => l.split('\t'));
const loader = new STLLoader();
// parts.tsv: id, name and kind (bone when left out; cartilage for costal cartilages and discs)
await Promise.all(list.map(async ([id, name, kind]) => {
  const g = loader.parse(await (await fetch(`stl/${id}.stl`)).arrayBuffer());
  g.computeVertexNormals(); g.computeBoundingBox();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: BONE, roughness: .75, metalness: 0 }));
  scene.add(m); parts.set(id, { m, name, g, kind: kind || (/cartilage|disk/.test(name) ? 'cartilage' : 'bone') });
}));
const DIRS = { front: [0, -1, 0], back: [0, 1, 0], right: [-1, 0, 0], left: [1, 0, 0], top: [0, 0, 1], bottom: [0, 0, -1] };
// job: { hi:[ids], focus:[ids], hide:[ids], only:[ids], view:'front'|[x,y,z], up:[x,y,z], pad, xray:bool }
// Without `only`, only the skeleton is drawn (bones and cartilage), plus the highlighted parts.
window.shot = job => {
  W = job.w || 900; H = job.h || 900; renderer.setSize(W, H);
  const hi = new Set(job.hi || []), only = job.only && new Set(job.only), hide = new Set(job.hide || []);
  for (const [id, p] of parts) {
    p.m.visible = !hide.has(id) && (hi.has(id) || (only ? only.has(id) : p.kind === 'bone' || p.kind === 'cartilage'));
    const mat = p.m.material, h = hi.has(id);
    mat.color.setHex(h ? HI : COLOUR[p.kind]);
    mat.transparent = !!job.xray && !h; mat.opacity = mat.transparent ? .22 : 1; mat.depthWrite = !mat.transparent; mat.needsUpdate = true;
    p.m.renderOrder = h ? 0 : 1;
  }
  const box = new THREE.Box3();
  for (const id of (job.focus || job.hi || [...parts.keys()])) { const p = parts.get(id); if (p) box.union(p.g.boundingBox); }
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const dir = new THREE.Vector3(...(Array.isArray(job.view) ? job.view : DIRS[job.view || 'front'])).normalize();
  const up = new THREE.Vector3(...(job.up || (Math.abs(dir.z) > .9 ? [0, -1, 0] : [0, 0, 1])));
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 6000);
  cam.up.copy(up); cam.position.copy(c).addScaledVector(dir, 2500); cam.lookAt(c); cam.updateMatrixWorld();
  // fit: project box corners into camera space
  const inv = cam.matrixWorldInverse; let mx = 0, my = 0;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const v = new THREE.Vector3(x, y, z).applyMatrix4(inv).sub(c.clone().applyMatrix4(inv)); mx = Math.max(mx, Math.abs(v.x)); my = Math.max(my, Math.abs(v.y));
  }
  const h = Math.max(mx * H / W, my) * (job.pad || 1.12);
  cam.left = -h * W / H; cam.right = h * W / H; cam.top = h; cam.bottom = -h;
  if (job.shift) { cam.left += job.shift[0]; cam.right += job.shift[0]; cam.top += job.shift[1]; cam.bottom += job.shift[1]; }
  cam.updateProjectionMatrix();
  key.position.copy(cam.position).add(new THREE.Vector3(...(job.light || [300, -300, 800]))); key.target.position.copy(c);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Buddy</title>
<meta name="description" content="Practise flash-card style knowledge tests, like the U.S. citizenship civics test or a driving theory test, with a history of every answer.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172129" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== Shared look: petravanta's apps =====
   Canonical copy of the tokens, type and components used by Fitness Coach and Skating Mentor (and this hub).
   Apps currently inline this block between "Shared look" and "end shared look"; update both when it changes.
   Each app only overrides the --accent values after this block. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */
/* Study Buddy accent: cyan */
:root{--accent:#0b7285;--accent-ink:#ffffff;--accent-soft:#d7eef2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#5fd0e4;--accent-ink:#04242a;--accent-soft:#0f2f36}}
:root[data-theme="dark"]{--accent:#5fd0e4;--accent-ink:#04242a;--accent-soft:#0f2f36}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.picker{display:flex;align-items:center;gap:8px;min-width:0}
.picker select{padding:5px 10px;font-size:14px;border-radius:999px;max-width:240px}
nav.tabs .end{margin-left:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 0}
.hero{display:flex;flex-direction:column;gap:12px}
.hero p{max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px}
.card h2{font-size:17px}
.card .row:last-child{margin-top:auto;padding-top:4px}
.card.add{border-style:dashed;background:none;align-items:flex-start;justify-content:center}
.sub{font-size:13px;color:var(--muted)}
.why{font-size:13px;color:var(--muted);font-style:italic}
.lvbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.lvbar i{display:block;height:100%}
.lv-mastered{background:var(--lv-solid)}.lv-confident{background:var(--lv-conf)}.lv-getting{background:var(--lv-dev)}.lv-learning{background:var(--lv-learn)}.lv-new{background:var(--lv-new)}
.lvkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.lvkey span{display:inline-flex;align-items:center;gap:5px}
.lvkey i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pill.pass{background:var(--lv-solid-bg);color:var(--lv-solid)}
.pill.fail{background:var(--danger-soft);color:var(--danger)}
.qlist{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.qrow:first-child{border-top:0}
.qrow:hover .qp{color:var(--accent)}
.qrow .qp{font-weight:600}
.qrow .qa{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--lv-conf)}
.dots i.x{background:var(--danger)}
.search{flex:1 1 200px}
.search input{width:100%}
.study{max-width:700px;margin:0 auto;width:100%}
.runbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.runbar .grow{flex:1 1 0}
.flash{display:flex;flex-direction:column;gap:16px;padding:24px 22px;min-height:260px}
.flash .meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.flash .prompt{font-size:22px;font-weight:600;line-height:1.35;text-wrap:balance}
.figure{margin:0;align-self:flex-start;max-width:min(100%,520px);display:flex;flex-direction:column;gap:4px}
.figure .zoom{display:block;padding:6px;border:0;border-radius:8px;background:#fff;cursor:zoom-in}
.figure img{display:block;width:100%;height:auto;max-height:min(56vh,520px);object-fit:contain}
.figure figcaption,.zoombox p{font-size:11px;color:var(--faint)}
.figure figcaption a,.zoombox p a{color:inherit}
#zoom{position:fixed;inset:0;z-index:50;background:rgba(10,16,20,.8);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));cursor:zoom-out}
.zoombox{position:relative;background:#fff;border-radius:var(--r);padding:12px;max-width:100%;max-height:100%;display:flex;flex-direction:column;gap:6px;cursor:default}
.zoombox img{display:block;max-width:100%;max-height:calc(100vh - 90px);object-fit:contain;min-height:0}
.zoombox p{color:#566771}
.zoombox .x{position:absolute;top:8px;right:8px;background:#e3e9ec;color:#14212a;border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
.flash.studycard{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
@media (max-width:520px){.flash{padding:18px 16px}.flash .prompt{font-size:19px}}
.need{font-size:14px;color:var(--accent);font-weight:600}
.ans{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.ans .one{font-size:19px;font-weight:600}
.ans ul{margin:0;padding-left:20px}
.ans .note{font-size:13px;background:var(--lv-learn-bg);color:var(--ink);border-radius:8px;padding:8px 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-weight:500;display:flex;gap:12px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--f-mono);color:var(--faint);font-size:13px}
.opt.right{border-color:var(--lv-solid);background:var(--lv-solid-bg)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark .btn{padding:14px 10px;font-size:16px}
.btn.ok{background:var(--lv-solid);border-color:var(--lv-solid);color:var(--surface)}
.btn.no{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.verdict{font-weight:700;font-size:17px}
.verdict.ok{color:var(--lv-solid)}
.verdict.no{color:var(--danger)}
.typed{display:flex;gap:8px;flex-wrap:wrap}
.typed input{flex:1 1 220px;font-size:17px;padding:10px 12px}
.kbd{font-size:12px;color:var(--faint)}
@media (pointer:coarse){.kbd{display:none}}
.score{font-family:var(--f-mono);font-size:44px;line-height:1.1}
.review .entry b{font-weight:600}
.ok-t{color:var(--lv-solid);font-weight:700}
.no-t{color:var(--danger);font-weight:700}
.form{display:flex;flex-direction:column;gap:12px}
.form .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form textarea{min-height:70px}
.form .check{display:flex;gap:8px;align-items:center;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.lib{display:flex;flex-direction:column;gap:8px}
.lib button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.lib button:hover{border-color:var(--accent)}
.lib button b{font-weight:600}
.lib button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.preview{max-height:220px;overflow:auto;background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:13px}
.preview ol{margin:0;padding-left:20px}
.countdown{font-family:var(--f-mono)}
.chapters{margin:0;padding-left:20px}
input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
.ctx.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.ctx.three{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="https://petravanta.github.io/general/">All apps</a>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="3" width="18" height="22" rx="3" fill="var(--accent)" opacity=".45" transform="rotate(10 18 14)"/><rect x="5" y="7" width="18" height="22" rx="3" fill="var(--accent)"/><path d="M9.5 18.5l3.5 3.5 6.5-7.5" fill="none" stroke="var(--surface)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Study Buddy
      </div>
      <div class="picker">
        <label class="sr-only" for="progPick">Study programme</label>
        <select id="progPick"></select>
      </div>
      <span class="save-state" id="saveState">Saved in this browser</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button type="button" data-tab="practice">Practice</button>

</header>

<div id="layer"></div>
<div id="zoom" hidden></div>
<input type="file" id="fileIn" accept=".json,.csv,.tsv,.txt,application/json,text/csv,text/plain" hidden>
<script>
'use strict';
/* Study Buddy. A programme is what you are studying for: some question sets, the practice tests you set up for it and
   an exam date. Every answer you give is an attempt record (set, question, right or wrong, when), so each question
   keeps its whole history across programmes, and qstat() works out how well you know it from that history.
   Built-in sets are data in data/sets/; sets you import or write are records in your own document.
   User data follows the "User data" section of petravanta/general STANDARDS.md. */

/* Google Drive sync: the shared OAuth client for petravanta.github.io (see README). Leave empty to turn Drive off. */
const GOOGLE_CLIENT_ID = '326863468616-4hf2conk0ks0s4qdva9tphphdo7ht7eh.apps.googleusercontent.com';
const KEY = 'studyBuddy.data', CUR_KEY = 'studyBuddy.current', TAB_KEY = 'studyBuddy.tab';
const LISTS = ['programmes', 'sets', 'testTypes', 'tests', 'attempts', 'personal'];
const LEVELS = {
  mastered: { label: 'Mastered', cls: 'l4', hint: 'right the last 4 times or more' },
  confident: { label: 'Confident', cls: 'l3', hint: 'right the last 2 or 3 times' },
  getting: { label: 'Getting there', cls: 'l2', hint: 'right last time' },
  learning: { label: 'Learning', cls: 'l1', hint: 'missed last time' },
  new: { label: 'New', cls: '', hint: 'not answered yet' }
};
const PICKS = { weakest: 'Weakest first', due: 'Due for review first', random: 'Random', unseen: 'New ones first', missed: 'Only ones I missed last time', inorder: 'In order' };
const ANSWER_MODES = { self: 'Flip the card and mark yourself', choice: 'Multiple choice', typed: 'Type the answer' };
const FEEDBACK = { each: 'After each question', end: 'Only at the end' };
const NEW_TEST = { name: 'Practice test', count: 20, pass: 80, pick: 'random', answer: 'choice', feedback: 'each', stopEarly: false, timeLimit: 0, tags: [] };
const QUICK = { count: 20, pick: 'weakest', answer: 'self', from: '' };
const LEARN = { size: 10, answer: 'self', from: '' };
const INTERVALS = [0, 1, 3, 7, 16, 35];   // days until a question you got right is due again, by its right streak
const MAX_REVIEWS = 20;   // reviews in one Learn session, besides the new cards

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const qid = () => Math.random().toString(36).slice(2, 10);
const now = () => new Date().toISOString();

/* ---------- The document ---------- */

let doc = upgrade(lsGet(KEY));
let curId = lsGet(CUR_KEY);
let tab = lsGet(TAB_KEY) || 'practice';
let rev = 0;
let run = null;   // the flashcard round or test in progress
const BUILTIN = new Map();

const moduleSets = name => builtinIds.map(id => BUILTIN.get(id)).filter(s => s && s.module === name);
const qCount = sets => sets.reduce((n, s) => n + s.questions.length, 0);

const testTypesOf = p => doc.testTypes.filter(t => t.p === p.id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

/* ---------- What you know: each question's history ---------- */
let histCache = { rev: -1, map: null };

// Every question in the programme's sets, optionally only those with one of `tags`. A question whose answer

function pool(p, tags) {

}
function levelCounts(items) {

}
// The order questions are asked in
function order(items, pick) {
  const xs = items.map((it, i) => ({ it, i, st: qstat(it.key), r: Math.random() }));
  const seen = x => x.st.last ? x.st.last.at : '';

  if (pick === 'random') return shuffle(items);
  if (pick === 'missed') return shuffle(xs.filter(x => x.st.level === 'learning')).map(x => x.it);
  if (pick === 'due') {   // most overdue first, then the rest weakest first
    const due = xs.filter(x => isDue(x.st)).sort((a, b) => dueTime(a.st) - dueTime(b.st) || a.r - b.r);
    return [...due.map(x => x.it), ...order(xs.filter(x => !isDue(x.st)).map(x => x.it), 'weakest')];

  const rank = pick === 'unseen' ? ['new', 'learning', 'getting', 'confident', 'mastered'] : ['learning', 'new', 'getting', 'confident', 'mastered'];

// A chapter (set) or topic (tag) to study on its own: '' for everything, 's:<set id>' or 't:<tag>'

/* ---------- Checking typed answers. Words in (brackets) are optional; small typos are forgiven ---------- */
const STOP = new Set(['the', 'a', 'an', 'to', 'of', 'is', 'are']);

/* ---------- A round of questions ---------- */
let timerT = null;
let skipFill = false;   // "Not now" on the fill-in prompt lasts until the page reloads
function startRun(p, cfg, testType, fixed) {

  if (blank.length && !skipFill) return fillDrawer(blank, () => startRun(p, cfg, testType, fixed));
  let items = fixed || order(focus(pool(p, cfg.tags), cfg.from).filter(it => !it.blank), cfg.pick);
  if (!items.length) return toast(cfg.pick === 'missed' ? 'Nothing was missed last time.' : 'There are no questions to ask yet. Add a set first.');
  if (!fixed && cfg.count > 0) items = items.slice(0, cfg.count);
  run = {
    id: uid(), p: p.id, cfg: { feedback: 'each', ...cfg }, test: !!testType, type: testType ? testType.id : null, name: testType ? testType.name : 'Flashcards',
    started: now(), deadline: cfg.timeLimit ? Date.now() + cfg.timeLimit * 60000 : 0, all: pool(p).filter(it => !it.blank),
    items: items.map(it => ({ ...it, ok: null, given: '' })), i: 0, phase: 'ask', done: false, learn: !!cfg.learn

// A Learn session: the reviews that are due, then a few new cards, each shown with its answer first (`study`) and asked a

function startLearn(p, cfg) {
  const items = focus(pool(p), cfg.from), blank = items.filter(it => it.blank);
  if (blank.length && !skipFill) return fillDrawer(blank, () => startLearn(p, cfg));
  const ready = items.filter(it => !it.blank).map(it => ({ it, st: qstat(it.key) }));
  const due = ready.filter(x => x.st.n && isDue(x.st)).sort((a, b) => dueTime(a.st) - dueTime(b.st)).slice(0, MAX_REVIEWS).map(x => ({ ...x.it, review: true }));

function renderPractice(p) {

  const lItems = focus(items, l.from).filter(it => !it.blank).map(it => qstat(it.key));

      <div class="stat"><b>${items.length - c.new}</b><span>Seen</span></div>
      <div class="stat"><b>${todayN}</b><span>Answered today</span></div>

  <section class="panel stack">

    <div class="ctx three">

      <label class="field">New cards<select data-learn="size">${[5, 10, 20].map(n => `<option value="${n}"${l.size === n ? ' selected' : ''}>${n} at a time</option>`).join('')}</select></label>
      <label class="field">Answer by<select data-learn="answer">${Object.entries(ANSWER_MODES).map(([k, v]) => `<option value="${k}"${l.answer === k ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
    </div>

      <span class="sub">${lDue || lNew ? [lDue ? `${lDue} due for review` : '', lNew ? `${Math.min(lNew, l.size)} new (${lNew} not seen yet)` : ''].filter(Boolean).join(' · ') : 'Nothing due right now, and every card has been seen. Flashcards still work any time.'}</span></div>
  </section>
  <section class="panel stack">
    <div><h2>Flashcards</h2><p class="sub">Go through cards at your own pace. Every answer counts toward each question’s history.</p></div>
    <div class="ctx">
      <label class="field">Topic<select data-quick="from">${focusOptions(p, items, q.from)}</select></label>
      <label class="field">Cards<select data-quick="count">${[10, 20, 50, 0].map(n => `<option value="${n}"${q.count === n ? ' selected' : ''}>${n || 'All ' + items.length}</option>`).join('')}</select></label>
      <label class="field">Which<select data-quick="pick">${Object.entries(PICKS).map(([k, v]) => `<option value="${k}"${q.pick === k ? ' selected' : ''}>${v}</option>`).join('')}</select></label>

      ${t.why ? `<p class="why">${esc(t.why)}</p>` : ''}
      ${l ? `<p class="small">Last: ${l.right} of ${l.total} ${l.passed ? '<span class="pill pass">Passed</span>' : '<span class="pill fail">Not yet</span>'} <span class="muted">${esc(fmtWhen(l.at))}</span></p>` : '<p class="small muted">Not taken yet</p>'}
      <div class="row"><button class="btn primary" type="button" data-test="${esc(t.id)}">Start</button><button class="btn ghost" type="button" data-edit-test="${esc(t.id)}">Edit</button></div></section>`; }).join('')}
    <section class="panel card add"><p class="small">Set how many questions, the pass mark, which questions and how you answer.</p><button class="btn" type="button" data-act="newTest">+ New practice test</button></section>
  </div>`;
}

let qFilter = { level: 'all', text: '', set: '', tag: '' };

function drawQList(p) {

  }).join('') : '<p class="empty">No questions match.</p>';
}

function renderHistory(p) {
  const tests = testsOf(p), ids = new Set(p.sets);

      <div class="stat"><b>${mine.length}</b><span>Answers given</span></div>

    </section>

    ${tests.length ? `<section class="panel"><div class="qlist">${tests.map(t => `<button class="qrow" type="button" data-review="${esc(t.id)}">
        <span><span class="qp">${esc(t.name)}</span><br><span class="qa">${esc(fmtWhen(t.at))}${t.stopped ? ' · ended early' : ''}${t.timeUp ? ' · time ran out' : ''}${t.asked < t.total && !t.stopped && !t.timeUp ? ` · ${t.asked} of ${t.total} asked` : ''}</span></span>
        <span class="side"><span class="pill ${t.passed ? 'pass' : 'fail'}">${t.passed ? 'Passed' : 'Not yet'}</span><span class="small mono">${t.right} / ${t.total}</span></span></button>`).join('')}</div></section>`
      : '<section class="panel empty">No practice tests yet. Start one from Practice.</section>'}

function renderSets(p) {
  const sets = p.sets.map(setById).filter(Boolean), missing = p.sets.length - sets.length;
  // chapters added to a module since this programme started with it
  const more = [...new Set(sets.filter(s => s.module && isBuiltin(s.id)).map(s => s.module))].flatMap(m => moduleSets(m)).filter(s => !p.sets.includes(s.id));
  return `${more.length ? `<div class="banner"><p><b>${more.length === 1 ? 'A new chapter is ready' : `${more.length} new chapters are ready`}:</b> ${esc(more.map(s => s.name).join(', '))}.</p><button class="btn sm primary" type="button" data-act="addChapters">Add ${more.length === 1 ? 'it' : 'them'}</button></div>` : ''}
  <div class="toolbar"><h3 class="grow">Question sets in ${esc(p.name)}</h3><button class="btn primary" type="button" data-act="addSet">+ Add a set</button></div>
    <div class="cards">${sets.map(s => {
      const items = s.questions.map(q => ({ s, q, key: s.id + '/' + q.id })), c = levelCounts(items);
      return `<section class="panel card"><h2>${esc(s.name)}</h2><p class="sub">${s.module && isBuiltin(s.id) ? esc(s.module) + ' chapter · ' : ''}${plural(s.questions.length, 'question')}${isBuiltin(s.id) ? ' · built in' : ' · your own'}</p>
        ${s.description ? `<p class="small">${esc(s.description)}</p>` : ''}
        ${levelBar(c, items.length)}
        <div class="row"><button class="btn" type="button" data-open-set="${esc(s.id)}">${isBuiltin(s.id) ? 'View' : 'Edit'}</button>

}

/* ---------- The round on screen ---------- */
// A question's picture, such as a circuit diagram it asks about, with its credit. One marked `reveal` belongs with the
// answer, so it only shows once the answer does (`shown`). Tapping it opens it full size.
function figure(q, shown = true) {
  const f = q.figure;
  if (!f || (f.reveal && !shown)) return '';
  const by = f.credit ? (f.source ? `<a href="${esc(f.source)}" target="_blank" rel="noopener">${esc(f.credit)}</a>` : esc(f.credit)) : '';
  const lic = f.license ? (f.licenseUrl ? `<a href="${esc(f.licenseUrl)}" target="_blank" rel="noopener">${esc(f.license)}</a>` : esc(f.license)) : '';
  return `<figure class="figure"><button type="button" class="zoom" data-zoom aria-label="Show the picture full size"><img src="${esc(f.src)}" alt="${esc(f.alt || '')}" loading="lazy"></button>${by || lic ? `<figcaption>${[by, lic].filter(Boolean).join(' · ')}</figcaption>` : ''}</figure>`;
}
function zoomFigure(fig) {
  const img = fig.querySelector('img'), cap = fig.querySelector('figcaption');
  const z = $('#zoom');
  z.innerHTML = `<div class="zoombox" role="dialog" aria-modal="true" aria-label="Picture"><button class="x" type="button" data-unzoom aria-label="Close">×</button><img src="${esc(img.getAttribute('src'))}" alt="${esc(img.alt)}">${cap ? `<p class="small">${cap.innerHTML}</p>` : ''}</div>`;
  z.hidden = false;
  z.querySelector('[data-unzoom]').focus();
}
function unzoom() { const z = $('#zoom'); z.hidden = true; z.innerHTML = ''; }
function answerBlock(q) {
  const need = q.need || 1, many = q.answers.length > 1;
  if (!q.answers.length) return `<div class="ans"><p class="small muted">Your own answer: ${esc(q.personal ? q.personal.ask : '')}. Not filled in yet.</p></div>`;
  return `<div class="ans">
    ${many ? `<p class="small muted">${need > 1 ? `Any ${need} of these:` : 'Any of these:'}</p><ul>${q.answers.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : `<p class="one">${esc(q.answers[0])}</p>`}
    ${q.explanation ? `<p class="small">${esc(q.explanation)}</p>` : ''}
    ${q.note ? `<p class="note">${esc(q.note)}</p>` : ''}
  </div>`;
}
function renderRun() {
  const it = run.items[run.i], q = it.q, N = run.items.length, mode = run.cfg.answer, showScore = run.cfg.feedback !== 'end' || mode === 'self';
  const multi = cur() && cur().sets.length > 1;
  const meta = [it.study ? 'New card' : it.review ? 'Review' : '', multi ? it.s.name : '', (q.tags || []).slice(-1)[0]].filter(Boolean).join(' · ');
  const answered = run.phase !== 'ask';
  const back = run.learn && it.again ? '<p class="small muted">This one comes back in a few cards.</p>' : '';
  let body = '';
  if (it.study) {
    body = `${answerBlock(q)}<div class="row"><button class="btn primary big" type="button" data-run="studied">Got it</button><span class="kbd">Space or Enter</span></div>
      <p class="small muted">Take a moment with it. You’ll be asked it in a few cards.</p>`;
  } else if (mode === 'self') {
    body = run.phase === 'ask'
      ? `<button class="btn primary big" type="button" data-run="reveal">Show answer</button><span class="kbd">Space</span>`
      : `${answerBlock(q)}<div class="mark"><button class="btn ok" type="button" data-run="knew">I knew it</button><button class="btn no" type="button" data-run="missed">I didn’t</button></div><span class="kbd">Y or 1 · N or 2</span>${run.learn ? '<p class="small muted">Be honest: a card you didn’t know comes back in a few cards.</p>' : ''}`;
  } else if (mode === 'choice') {
    const fb = run.phase === 'feedback';
    body = `<div class="opts">${it.opts.map((o, i) => `<button class="opt${fb && o.ok ? ' right' : ''}${fb && !o.ok && it.given === o.t ? ' wrong' : ''}" type="button" data-opt="${i}"${fb ? ' disabled' : ''}><span class="k">${i + 1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
      ${fb ? `<p class="verdict ${it.ok ? 'ok' : 'no'}">${it.ok ? 'Right' : 'Not quite'}</p>${answerBlock(q)}${back}<div class="row"><button class="btn primary big" type="button" data-run="next">Next</button><span class="kbd">Enter</span></div>` : '<span class="kbd">Keys 1 to ' + it.opts.length + '</span>'}`;
  } else {
    body = run.phase === 'ask'
      ? `<form class="typed" id="typedForm"><label class="sr-only" for="typedIn">Your answer</label><input type="text" id="typedIn" autocomplete="off" autocapitalize="off" placeholder="${(q.need || 1) > 1 ? 'Separate answers with commas' : 'Your answer'}"><button class="btn primary" type="submit">Check</button><button class="btn ghost" type="button" data-run="dunno">I don’t know</button></form>`
      : `<p class="verdict ${it.ok ? 'ok' : 'no'}">${it.ok ? 'Right' : 'Not quite'}</p>${it.given ? `<p class="small">You wrote: <b>${esc(it.given)}</b></p>` : ''}${answerBlock(q)}${back}
        <div class="row"><button class="btn primary big" type="button" data-run="next">Next</button>${it.given ? `<button class="btn ghost" type="button" data-run="overrule">${it.ok ? 'Actually, count it wrong' : 'I was right, count it'}</button>` : ''}<span class="kbd">Enter</span></div>`;
  }
  const keys = run.learn ? learnKeys().length : 0, learned = run.learn ? learnedKeys().size : 0;
  return `<div class="study stack">
    <div class="runbar"><b>${esc(run.name)}</b>${run.learn ? `<span class="small mono"><span class="ok-t">${learned}</span> of ${keys} cards done</span>` : `<span class="muted small mono">${run.i + 1} / ${N}</span>
      ${showScore ? `<span class="small mono"><span class="ok-t">${rightSoFar()}</span> right${run.test && needed(run) ? ` · need ${needed(run)}` : ''}</span>` : ''}`}
      ${run.deadline ? `<span class="small mono" id="timer">${clockText(run.deadline - Date.now())}</span>` : ''}
      <span class="grow"></span><button class="btn sm ghost" type="button" data-run="end">End</button></div>
    <div class="meter"><i style="width:${(run.learn ? learned / keys : run.i / N) * 100}%"></i></div>
    <section class="panel flash${it.study ? ' studycard' : ''}">
      ${meta ? `<p class="meta">${esc(meta)}</p>` : ''}
      <p class="prompt">${esc(q.prompt)}</p>
      ${figure(q, answered)}
      ${(q.need || 1) > 1 ? `<p class="need">Give ${q.need} answers.</p>` : ''}
      ${body}
    </section></div>`;
}
function renderLearnResult() {
  const keys = learnKeys(), learned = learnedKeys();
  const byKey = keys.map(k => { const xs = run.items.filter(i => i.key === k); return { it: xs[0], fresh: xs.some(i => i.study), tries: xs.filter(i => i.ok !== null).length, ok: learned.has(k) }; });
  const done = byKey.filter(x => x.tries), fresh = done.filter(x => x.fresh && x.ok).length, again = done.filter(x => x.tries > 1).length;
  const firstTime = done.filter(x => x.ok && x.tries === 1).length;
  return `<div class="study stack">
    <section class="panel stack">
      <h3>Learn</h3>
      <div class="row" style="align-items:baseline;gap:14px"><span class="score">${learned.size} / ${keys.length}</span><span class="muted">cards done</span></div>
      <p class="small">${[fresh ? `${plural(fresh, 'new card')} learned` : '', firstTime ? `${firstTime} right first time` : '', again ? `${again} needed another go` : ''].filter(Boolean).join(' · ') || 'Nothing answered yet.'}</p>
      <p class="small muted">Cards you got right come back for review in a day, then after longer and longer gaps while you keep getting them right. Start Learn again whenever you like: it asks what’s due first.</p>
      <div class="row"><button class="btn primary" type="button" data-run="again">Keep learning</button><button class="btn ghost" type="button" data-run="close">Done</button></div>
    </section>
    ${done.length ? `<section class="panel review"><h3>Cards</h3>${done.map(x => `<div class="entry"><div><b>${esc(x.it.q.prompt)}</b><div class="meta">${esc(x.it.q.answers.slice(0, x.it.q.need || 1).join(', '))}${x.fresh ? ' · new' : ''}${x.tries > 1 ? ` · ${x.tries} tries` : ''}</div></div><span class="${x.ok ? 'ok-t' : 'no-t'}">${x.ok ? '✓' : '✗'}</span></div>`).join('')}</section>` : ''}
  </div>`;
}
function renderResult() {
  if (run.learn) return renderLearnResult();
  const asked = run.items.filter(i => i.ok !== null), right = rightSoFar(), missed = asked.filter(i => !i.ok), need = needed(run);
  const passed = right >= need;
  return `<div class="study stack">
    <section class="panel stack">
      <h3>${esc(run.name)}</h3>
      <div class="row" style="align-items:baseline;gap:14px"><span class="score">${right} / ${run.test ? run.items.length : asked.length}</span>
        ${run.test && need ? `<span class="pill ${passed ? 'pass' : 'fail'}" style="font-size:14px">${passed ? 'Passed' : 'Not passed yet'}</span>` : ''}</div>
      <p class="small muted">${run.test && need ? `You needed ${need} right. ` : ''}${asked.length < run.items.length ? `${plural(asked.length, 'question')} asked of ${run.items.length}${run.timeUp ? ', then time ran out' : run.stopped ? ', then you ended it' : run.cfg.stopEarly ? ', which settled it' : ''}.` : ''}</p>
      <div class="row">${missed.length ? `<button class="btn primary" type="button" data-run="redoMissed">Practise the ${plural(missed.length, 'one')} I missed</button>` : ''}
        <button class="btn" type="button" data-run="again">${run.test ? 'Take it again' : 'Another round'}</button>
        <button class="btn ghost" type="button" data-run="close">Done</button></div>
    </section>
    <section class="panel review"><h3>Answers</h3>${asked.map(it => `<div class="entry"><div><b>${esc(it.q.prompt)}</b><div class="meta">${it.given ? `You: ${esc(it.given)} · ` : ''}${esc(it.q.answers.slice(0, 4).join(' · '))}${it.q.answers.length > 4 ? ' …' : ''}</div></div><span class="${it.ok ? 'ok-t' : 'no-t'}">${it.ok ? '✓' : '✗'}</span></div>`).join('')}</section>

/* ---------- Drawers ---------- */
function openDrawer(title, inner, wire) {
  $('#layer').innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="x" type="button" data-close aria-label="Close">×</button><h2>${esc(title)}</h2>${inner}</aside>`;
  $('#layer').querySelectorAll('[data-close]').forEach(b => b.onclick = closeDrawer);
  const d = $('#layer .drawer');
  if (wire) wire(d);
  const f = d.querySelector('input,textarea,select'); if (f && matchMedia('(pointer:fine)').matches) f.focus();
}
function closeDrawer() { $('#layer').innerHTML = ''; }
// A delete button that asks for a second tap
function wireDelete(btn, label, onDelete) {
  if (!btn) return;
  btn.onclick = () => {
    if (btn.dataset.armed) return onDelete();
    btn.dataset.armed = '1'; btn.textContent = label;
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.label; } }, 4000);
  };
  btn.dataset.label = btn.textContent;
}
const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);

function questionDrawer(key) {

  if (!raw) return;
  const mine = raw.personal ? myAnswers(key) : null, q = mine && mine.length ? { ...raw, answers: mine } : raw;
  const st = qstat(key), progs = new Map(doc.programmes.map(p => [p.id, p.name]));
  openDrawer('Question', `<p class="prompt" style="font-size:18px;font-weight:600">${esc(q.prompt)}</p>${figure(q)}${answerBlock(q)}
    <div class="row">${pill(st.level)}${st.n ? `<span class="small">Right ${st.ok} of ${plural(st.n, 'time')}${st.streak > 1 ? `, the last ${st.streak} in a row` : ''}</span>` : '<span class="small muted">Not answered yet</span>'}</div>
    ${st.n ? `<h3>Every answer</h3><div>${st.h.slice().reverse().map(a => `<div class="entry"><div>${esc(fmtWhen(a.at))}<div class="meta">${a.t ? 'Test' : 'Flashcards'} · ${esc(ANSWER_MODES[a.m] || '')}${progs.size > 1 && progs.get(a.p) ? ' · ' + esc(progs.get(a.p)) : ''}${a.g ? ' · “' + esc(a.g) + '”' : ''}</div></div><span class="${a.ok ? 'ok-t' : 'no-t'}">${a.ok ? '✓' : '✗'}</span></div>`).join('')}</div>` : ''}
    <p class="small muted">${esc(s.name)}${(q.tags || []).length ? ' · ' + esc(q.tags.join(' · ')) : ''}</p>

    <div class="row">${raw.personal ? '<button class="btn" type="button" id="fillQ">Change my answer</button>' : ''}${isBuiltin(s.id) ? '' : '<button class="btn" type="button" id="editQ">Edit question</button>'}</div>`,

// Questions whose answer depends on the person (their Senators, their state capital): ask for their answers
function fillDrawer(items, then) {

    <form class="form" id="ff">${items.map((it, i) => `<label class="field">${esc(it.q.prompt)}<textarea name="a${i}" rows="2" placeholder="${esc(it.q.personal.ask)}">${esc((myAnswers(it.key) || []).join('\n'))}</textarea></label>${it.q.personal.hint ? `<p class="hint">${esc(it.q.personal.hint)}</p>` : ''}`).join('')}

// Add a set to a programme, and the practice tests it suggests that the programme doesn't have yet
function linkSet(p, s) {
  if (!s || p.sets.includes(s.id)) return;
  p.sets.push(s.id); touch(p);
  const names = new Set(testTypesOf(p).map(t => t.name));
  let n = testTypesOf(p).length;
  for (const t of s.tests || []) if (!names.has(t.name)) doc.testTypes.push(touch({ ...NEW_TEST, ...t, id: uid(), p: p.id, order: n++ }));
}

  openDrawer(q ? 'Edit question' : 'New question', `<form class="form" id="qf">

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
// CSV or tab-separated rows, with quoted cells
function parseRows(text) {
  text = String(text).replace(/^﻿/, '');
  const first = text.split('\n')[0] || '', sep = first.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; } else cell += ch;
    } else if (ch === '"' && cell === '') quoted = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

}
const COLS = { prompt: ['question', 'prompt', 'term', 'front', 'q'], answers: ['answer', 'answers', 'definition', 'back', 'a'], need: ['need'], wrong: ['wrong', 'distractors', 'choices'], explanation: ['explanation', 'why'], note: ['note'], personal: ['personal', 'your answer'], tags: ['tags', 'tag', 'topic', 'topics', 'category'] };
function parseTable(text) {
  const rows = parseRows(text);
  let map = { prompt: 0, answers: 1 }, start = 0;
  const head = (rows[0] || []).map(c => c.trim().toLowerCase());
  if (head.some(h => COLS.prompt.includes(h))) {
    map = {}; start = 1;
    for (const [k, names] of Object.entries(COLS)) { const i = head.findIndex(h => names.includes(h)); if (i >= 0) map[k] = i; }
  }
  const split = v => String(v || '').split('|').map(x => x.trim()).filter(Boolean);
  const questions = []; let skipped = 0;
  for (const r of rows.slice(start)) {
    const get = k => map[k] == null ? '' : (r[map[k]] || '').trim();
    const q = cleanQuestion({ prompt: get('prompt'), answers: split(get('answers')), need: +get('need') || 1, wrong: split(get('wrong')), explanation: get('explanation'), note: get('note'), personal: get('personal'), tags: split(get('tags')) });

// Keep only the fields a question has, tidied; null when it has no prompt or answer
function cleanQuestion(x) {
  if (!x || typeof x !== 'object') return null;
  const str = v => typeof v === 'string' ? v.trim() : v == null ? '' : String(v).trim();
  const arr = v => (Array.isArray(v) ? v : v == null || v === '' ? [] : [v]).map(str).filter(Boolean);
  const prompt = str(x.prompt ?? x.question ?? x.term ?? x.front);
  const ask = str(x.personal && typeof x.personal === 'object' ? x.personal.ask : x.personal);
  const answers = ask ? [] : arr(x.answers ?? x.answer ?? x.definition ?? x.back);
  if (!prompt || (!ask && !answers.length)) return null;
  const q = { id: /^[a-z0-9-]+$/.test(str(x.id)) ? str(x.id) : '', prompt, answers };
  if (ask) { q.personal = { ask }; const h = str(x.personal && x.personal.hint); if (h) q.personal.hint = h; }
  const need = Math.round(+x.need || 1);
  if (need > 1) q.need = ask ? need : Math.min(need, answers.length);
  const wrong = arr(x.wrong); if (wrong.length) q.wrong = wrong;
  if (str(x.explanation)) q.explanation = str(x.explanation);
  if (str(x.note)) q.note = str(x.note);
  const fig = x.figure && typeof x.figure === 'object' ? str(x.figure.src) : '';
  if (/^(data\/[\w./-]+|https:\/\/\S+)$/.test(fig) && !fig.includes('..')) {
    q.figure = { src: fig };
    for (const k of ['alt', 'credit', 'license']) if (str(x.figure[k])) q.figure[k] = str(x.figure[k]);
    for (const k of ['source', 'licenseUrl']) if (/^https:\/\/\S+$/.test(str(x.figure[k]))) q.figure[k] = str(x.figure[k]);
    if (x.figure.reveal === true) q.figure.reveal = true;
  }
  const tags = arr(x.tags); if (tags.length) q.tags = [...new Set(tags)];
  return q;
}
function cleanTest(t) {
  const r = { ...NEW_TEST };
  if (!t || typeof t !== 'object') return null;
  r.name = String(t.name || 'Practice test').trim();
  r.count = Math.max(0, Math.round(+t.count || 0)); r.pass = clamp(Math.round(+t.pass || 0), 0, 100);
  if (PICKS[t.pick]) r.pick = t.pick; if (ANSWER_MODES[t.answer]) r.answer = t.answer; if (FEEDBACK[t.feedback]) r.feedback = t.feedback;
  r.stopEarly = !!t.stopEarly; r.timeLimit = Math.max(0, Math.round(+t.timeLimit || 0));
  r.tags = Array.isArray(t.tags) ? t.tags.map(String) : [];

}

/* ---------- Google Drive sync (optional) ---------- */
/* ===== Google sign-in shared by petravanta's apps =====
   Canonical copy: https://github.com/petravanta/general/blob/main/shared/google-token.js (see STANDARDS.md, "Staying connected to Google Drive").
   Every app lives on petravanta.github.io and uses the same OAuth client, so a Drive token one app gets works in all of them.
   This keeps that token where every app can see it (localStorage key petravanta.google), one per Google account, so
   reconnecting in one app reconnects them all, and an app only ever uses the token of the account it connected with.
   Google gives a static site no refresh token: a token lasts an hour, and getting a new one opens Google's window,
   which browsers only allow right after a tap. With the account's email as a hint, that window closes by itself. */
const GoogleToken=(()=>{
  const KEY='petravanta.google', SCOPE='https://www.googleapis.com/auth/drive.file';
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch(e){return {}}};
  const write=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};

  window.addEventListener('storage',e=>{if(e.key===KEY) subs.forEach(f=>{try{f()}catch(_){}})});
  function gis(){return new Promise((res,rej)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2) return res();
    const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.onload=res; s.onerror=()=>rej({code:'offline'}); document.head.appendChild(s)})}
  // A token for this account with time left on it, or null
  function get(email){const t=email&&(read().tokens||{})[email]; return t&&t.exp>Date.now()?t:null}
  // o: {clientId, hint:'email to suggest', prompt:'' | 'select_account' | 'consent'}. Call from a tap. Resolves {token, exp, email}.
  function request(o){return new Promise(async(res,rej)=>{
    try{await gis()}catch(e){return rej(e)}
    google.accounts.oauth2.initTokenClient({client_id:o.clientId,scope:SCOPE,login_hint:o.hint||undefined,error_callback:rej,
      callback:async r=>{
        if(r.error) return rej(r);

        // Which account it is, so the token is filed under the right one
        let email='';
        try{const j=await (await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:{Authorization:'Bearer '+t.token}})).json(); email=(j.user&&j.user.emailAddress)||''}catch(e){}
        if(!email) email=o.hint||'';
        if(email){

})();

/* ===== Drive store: petravanta's apps =====
   Canonical copy: https://github.com/petravanta/general/blob/main/shared/drive-store.js (see STANDARDS.md, "Data lives in Google Drive").
   Needs GoogleToken (shared/google-token.js) inlined above it.
   Keeps an app's data in one JSON file in the user's Google Drive (drive.file scope: the app only sees files it created).
   The browser keeps a copy of the last data, so the app opens straight away even when the hour-long Google sign-in has run out,
   and changes that haven't reached Drive yet (for example while offline). The first tap after that reconnects, merges with
   Drive's copy and saves. */

  //     onChange:()=>{}, onRemote:data=>{} (Drive's copy changed what the app shows)}

      if(pending) data=o.merge(pending,data);
      S.data=data; S.stale=false; S.err=null; S.last=new Date(); put('copy',data);
      if(!remote||pending){await write(data); put('pending',null)}
      return data;
    }catch(e){
      // offline with unsaved changes: carry on from them; they go to Drive once the connection is back
      if(e.code==='offline'&&pending){S.data=o.merge(pending,o.empty()); S.stale=true; S.err='offline'; return S.data}
      S.err=e.code==='offline'?'offline':e.code==='expired'?null:'error'; throw e;
    }finally{S.busy=false; note()}
  }
  // Pick up changes made on another device
  async function refresh(){
    if(!live()||S.busy||!S.data) return false;
    try{const r=await read(); if(!r) return false; const before=JSON.stringify(S.data); S.data=o.merge(r,S.data); S.stale=false; put('copy',S.data); return JSON.stringify(S.data)!==before}
    catch(e){return false}
  }
  function save(data){S.data=data; put('copy',data); if(!put('pending',data)) {/* storage full or blocked: Drive still gets it */} clearTimeout(S.timer); S.timer=setTimeout(flush,1500); note()}
  function signOut(){
    GoogleToken.forget(S.email);
    S.token=null; S.exp=0; S.data=null; S.stale=false; S.email=''; ['known','file','pending','copy','email'].forEach(k=>put(k,null)); S.known=false; note();
  }
  // Tokens last an hour. Renew on a tap when it is close to running out or gone, then save anything waiting.
  document.addEventListener('click',e=>{
    if(!o.clientId||!S.known||e.target.closest('[data-drive]')) return;
    live(); if(S.exp-Date.now()>10*60000||Date.now()-S.ask<60000) return;
    S.ask=Date.now(); signIn().then(flush).catch(()=>note());
  },true);
  // Another app or tab reconnected this account: carry on with its token
  GoogleToken.onChange(()=>{if(S.known&&S.data&&live()) flush(); else note()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') flush()});
  window.addEventListener('online',()=>flush());
  function status(){
    if(!S.data) return '';
    if(S.busy) return 'Saving to Google Drive…';
    const waiting=!!get('pending');
    if(S.err==='offline') return 'Offline · changes save to Drive when you’re back online';
    if(S.err) return 'Couldn’t reach Google Drive · will retry';
    if(!live()) return waiting?'Tap anywhere to save to Google Drive':'Tap anywhere to reconnect Google Drive';
    if(waiting) return 'Saving to Google Drive…';
    return 'Saved to Google Drive'+(S.last?' · '+S.last.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'');
  }
  return {load,save,flush,refresh,signIn,signOut,status,live,
    get data(){return S.data}, get known(){return S.known}, get configured(){return !!o.clientId}, get file(){return o.file},
    get needsTap(){return !!S.data&&!live()}};
}
/* ===== end Drive store ===== */
const store = DriveStore({
  clientId: GOOGLE_CLIENT_ID, file: 'Study Buddy data.json', app: 'study-buddy', key: 'studyBuddy.drive',
  empty: blankDoc, merge: (remote, local) => mergeDocs(local, remote),
  onChange: () => { showSaveState(); const dp = $('#drivePanel'); if (dp) { dp.innerHTML = drivePanel(); wireDrive(dp); } },
  onRemote: data => { doc = mergeDocs(doc, data); rev++; lsSet(KEY, doc); if (!run) render(); }
});
function showSaveState() { $('#saveState').textContent = store.known ? store.status() || 'Saved in this browser' : 'Saved in this browser'; }
function drivePanel() {
  if (!store.configured) return '<p class="small muted">Drive sync is turned off in this copy of the app.</p>';
  if (!store.known) return `<p class="small">Keep a copy in your own Google Drive, in <b>${esc(store.file)}</b>, and use the same data on your phone and computer. The app can only see files it created there.</p><div class="row"><button class="btn primary" type="button" data-drive="on">Connect Google Drive</button></div>`;
  return `<p class="small">${esc(store.status())}. Everything goes to <b>${esc(store.file)}</b> in your Drive a moment after each change.</p>
    <div class="row">${store.live() ? '' : '<button class="btn primary" type="button" data-drive="on">Reconnect</button>'}<button class="btn ghost" type="button" data-drive="off">Disconnect</button></div>`;
}
function wireDrive(el) {
  el.querySelectorAll('[data-drive]').forEach(b => b.onclick = async () => {
    if (b.dataset.drive === 'off') { store.signOut(); showSaveState(); const dp = $('#drivePanel'); if (dp) { dp.innerHTML = drivePanel(); wireDrive(dp); } return toast('Disconnected. Your data stays in this browser.'); }
    try { const remote = await store.load(true); doc = mergeDocs(doc, remote); changed(); toast('Connected to Google Drive'); }
    catch (e) { toast(e && e.code === 'offline' ? 'You seem to be offline.' : 'Couldn’t connect to Google Drive.'); }
  });
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, ms = 2600) {
  clearTimeout(toastTimer);
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg;
  toastTimer = setTimeout(() => t.remove(), ms);
}

/* ---------- Taps and keys ---------- */
$('#tabs').onclick = e => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  tab = b.dataset.tab; lsSet(TAB_KEY, tab); render();
};
$('#settingsBtn').onclick = settingsDrawer;
$('#progPick').onchange = e => {
  if (e.target.value === '+') { renderPicker(); return newProgDrawer(); }
  setCurrent(e.target.value); render();
};
$('#main').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const p = cur(), d = b.dataset;
  if (d.start) return newProgDrawer(d.start);
  if (d.test) { const t = doc.testTypes.find(x => x.id === d.test); return t && startRun(p, t, t); }
  if (d.editTest) return testDrawer(p, d.editTest);
  if (d.q) return questionDrawer(d.q);
  if (d.review) return reviewDrawer(d.review);
  if (d.openSet) return setDrawer(d.openSet);
  if (d.share) return shareSet(setById(d.share), p);
  if (d.unlink) { p.sets = p.sets.filter(x => x !== d.unlink); touch(p); changed(); return toast('Removed from this programme. Its history is kept.'); }
  if (d.level) { qFilter.level = d.level; document.querySelectorAll('[data-level]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); return drawQList(p); }
  if (d.opt != null && run && run.phase === 'ask') { const o = run.items[run.i].opts[+d.opt]; record(o.ok, o.t); return afterAnswer(); }
  if (d.run) return runAction(d.run);
  switch (d.act) {
    case 'newProg': return newProgDrawer();
    case 'settings': return settingsDrawer();
    case 'addSet': return addSetDrawer(p);
    case 'addChapters': { const ids = new Set(p.sets.map(setById).filter(s => s && s.module).map(s => s.module)); builtinIds.map(id => BUILTIN.get(id)).filter(s => s && ids.has(s.module)).forEach(s => linkSet(p, s)); changed(); return toast('Chapters added'); }
    case 'newTest': return testDrawer(p);
    case 'fill': return fillDrawer(pool(p).filter(it => it.blank));
    case 'flash': return startRun(p, { ...QUICK, ...(p.quick || {}), feedback: 'each' });
    case 'learn': return startLearn(p, { ...LEARN, ...(p.learn || {}) });
    case 'flashMissed': return startRun(p, { ...QUICK, ...(p.quick || {}), pick: 'missed', count: 0, feedback: 'each', from: '' });
    case 'exportAnswers': return exportAnswers(p);
  }
});
$('#main').addEventListener('change', e => {
  const p = cur(), t = e.target;
  if (t.dataset.quick) { p.quick = { ...QUICK, ...(p.quick || {}), [t.dataset.quick]: t.dataset.quick === 'count' ? +t.value : t.value }; touch(p); save(); }
  if (t.dataset.learn) { p.learn = { ...LEARN, ...(p.learn || {}), [t.dataset.learn]: t.dataset.learn === 'size' ? +t.value : t.value }; touch(p); changed(); }
  if (t.id === 'qSet') { qFilter.set = t.value; drawQList(p); }
  if (t.id === 'qTag') { qFilter.tag = t.value; drawQList(p); }
});
$('#main').addEventListener('input', e => { if (e.target.id === 'qSearch') { qFilter.text = e.target.value; drawQList(cur()); } });
$('#main').addEventListener('submit', e => {
  if (e.target.id !== 'typedForm') return;
  e.preventDefault();
  const v = $('#typedIn').value.trim();
  if (!v) return;
  record(checkTyped(run.items[run.i].q, v), v); afterAnswer();
});
function runAction(a) {
  const p = cur();
  switch (a) {
    case 'reveal': run.phase = 'reveal'; return render();
    case 'studied': requeue(run.items[run.i], 3); return next();
    case 'knew': record(true); return next();
    case 'missed': record(false); return next();
    case 'dunno': record(false, ''); return afterAnswer();
    case 'next': return next();
    case 'overrule': return overrule();
    case 'end': run.stopped = true; return finish();
    case 'again': { const r = run; run = null; if (r.learn) return startLearn(p, r.cfg); const t = r.type && doc.testTypes.find(x => x.id === r.type); return startRun(p, r.cfg, t || null); }
    case 'redoMissed': { const missed = run.items.filter(i => i.ok === false).map(({ s, q, key }) => ({ s, q, key })); run = null; return startRun(p, { ...QUICK, ...(p.quick || {}), feedback: 'each', pick: 'inorder', count: 0 }, null, missed); }
    case 'close': run = null; return render();
  }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#zoom').hidden) return unzoom();
  if (e.key === 'Escape' && $('#layer').innerHTML) return closeDrawer();
  if (!run || run.done || $('#layer').innerHTML || !$('#zoom').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName), mode = run.cfg.answer, k = e.key.toLowerCase();
  if (run.phase === 'study' && (k === ' ' || k === 'enter')) { e.preventDefault(); return runAction('studied'); }
  if (run.phase === 'ask' && mode === 'self' && (k === ' ' || k === 'enter') && !inField) { e.preventDefault(); return runAction('reveal'); }
  if (run.phase === 'reveal' && (k === 'y' || k === '1')) return runAction('knew');
  if (run.phase === 'reveal' && (k === 'n' || k === '2')) return runAction('missed');
  if (run.phase === 'ask' && mode === 'choice' && /^[1-9]$/.test(k)) { const o = run.items[run.i].opts[+k - 1]; if (o) { record(o.ok, o.t); afterAnswer(); } return; }
  if (run.phase === 'feedback' && (k === 'enter' || (k === ' ' && !inField))) { e.preventDefault(); return next(); }
});
document.addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z) return zoomFigure(z.closest('figure'));
  if (e.target.closest('[data-unzoom]') || e.target.id === 'zoom') unzoom();
});
addEventListener('storage', e => { if (e.key === KEY) { doc = upgrade(lsGet(KEY)); rev++; if (!run) render(); } });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && store.known && store.live() && await store.refresh()) { doc = mergeDocs(doc, store.data); rev++; lsSet(KEY, doc); if (!run) render(); }
});

/* ---------- Start ---------- */
(async () => {
  if (store.known && store.data) doc = mergeDocs(doc, store.data);
  render();
  showSaveState();
  await loadBuiltin();
  render();
  if (store.known && store.live()) {
    try { doc = mergeDocs(doc, await store.load(false)); rev++; lsSet(KEY, doc); store.save(doc); if (!run) render(); } catch (e) { showSaveState(); }
  }
})();
</script>
